<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login to Your Account – SkillForge</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Design System -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

  <!-- Top Simple Nav -->
  <nav class="navbar navbar-expand-lg public-navbar">
    <div class="container-fluid max-w-1200 px-lg-4">
      <a class="brand-logo" href="index.html">
        <div class="brand-icon">
          <i class="bi bi-hammer"></i>
        </div>
        <span>SkillForge</span>
      </a>
      <div class="ms-auto">
        <span class="text-muted small me-2 d-none d-sm-inline">Don't have an account?</span>
        <a href="register.html" class="btn btn-forge-primary btn-sm">Sign Up</a>
      </div>
    </div>
  </nav>

  <!-- Login Container (Matches Panel 3 in screenshot) -->
  <main class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-xl-9 col-lg-10">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="row g-0">
            
            <!-- Left Form Column -->
            <div class="col-md-7 p-4 p-lg-5 bg-white">
              <div class="mb-4">
                <h3 class="fw-bold text-navy mb-1">Welcome Back!</h3>
                <p class="text-muted small">Login to your SkillForge account</p>
              </div>

              <!-- Alert Box for Error Messages -->
              <div id="alertBox" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>
              <div id="infoBox" class="alert alert-info d-none py-2 px-3 small" role="alert"></div>

              <!-- Role Selection: Student Login vs Admin Login -->
              <div class="mb-4">
                <label class="form-label small fw-bold text-secondary text-uppercase mb-2" style="letter-spacing: 0.5px;">
                  Step 1: Select Your Role
                </label>
                <div class="row g-2" id="roleSelectionGroup">
                  <div class="col-6">
                    <button type="button" class="btn role-select-card w-100 p-3 text-start rounded-3 position-relative" id="roleBtnStudent" onclick="selectLoginRole('student')">
                      <div class="d-flex align-items-center gap-2 mb-1">
                        <i class="bi bi-mortarboard-fill fs-5 text-primary"></i>
                        <span class="fw-bold small text-navy role-label">Student Login</span>
                      </div>
                      <div class="text-muted" style="font-size: 0.73rem;">Roadmaps, skills & career</div>
                      <div class="role-check-indicator d-none position-absolute top-0 end-0 m-2">
                        <i class="bi bi-check-circle-fill text-primary"></i>
                      </div>
                    </button>
                  </div>
                  <div class="col-6">
                    <button type="button" class="btn role-select-card w-100 p-3 text-start rounded-3 position-relative" id="roleBtnAdmin" onclick="selectLoginRole('admin')">
                      <div class="d-flex align-items-center gap-2 mb-1">
                        <i class="bi bi-shield-lock-fill fs-5 text-secondary"></i>
                        <span class="fw-bold small text-navy role-label">Admin Login</span>
                      </div>
                      <div class="text-muted" style="font-size: 0.73rem;">Platform management</div>
                      <div class="role-check-indicator d-none position-absolute top-0 end-0 m-2">
                        <i class="bi bi-check-circle-fill text-primary"></i>
                      </div>
                    </button>
                  </div>
                </div>
                <div class="small text-muted mt-2" id="rolePromptText">
                  <i class="bi bi-info-circle me-1"></i>Please select your login role above to continue.
                </div>
              </div>

              <!-- Login Form Container (Visible after role is selected) -->
              <form id="loginForm" class="d-none" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label small fw-semibold text-secondary">Email Address</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control bg-light border-start-0" id="email" placeholder="Enter your email" required>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control bg-light border-start-0" id="password" placeholder="Enter your password" required>
                  </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label small text-muted" for="rememberMe">
                      Remember me
                    </label>
                  </div>
                  <a href="javascript:void(0)" onclick="alert('For this project demo, you can log in directly or create a new student account.')" class="text-primary small text-decoration-none fw-semibold">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-forge-primary w-100 py-2 mb-3" id="submitBtn">
                  <span id="submitBtnText">Login</span>
                  <i class="bi bi-box-arrow-in-right ms-1"></i>
                </button>

                <div class="text-center" id="registerPromptBox">
                  <span class="text-muted small">Don't have an account? </span>
                  <a href="register.html" class="text-primary fw-semibold small text-decoration-none">Register as Student</a>
                </div>
              </form>
            </div>

            <!-- Right Promotional Column (Student on laptop) -->
            <div class="col-md-5 p-4 p-lg-5 text-center d-flex flex-column justify-content-center" style="background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%);">
              <div class="my-auto py-3">
                <!-- Student vector SVG -->
                <svg viewBox="0 0 280 220" class="img-fluid mb-4" style="max-height: 190px;" xmlns="http://www.w3.org/2000/svg">
                  <!-- Desk shadow -->
                  <ellipse cx="140" cy="190" rx="110" ry="15" fill="#A7F3D0"/>
                  <!-- Student figure -->
                  <circle cx="140" cy="70" r="28" fill="#F87171"/>
                  <path d="M100 150 C100 105 180 105 180 150 Z" fill="#059669"/>
                  <!-- Laptop -->
                  <polygon points="90,175 190,175 200,185 80,185" fill="#374151"/>
                  <rect x="98" y="115" width="84" height="60" rx="5" fill="#111827"/>
                  <rect x="104" y="121" width="72" height="48" rx="3" fill="#1F2937"/>
                  <rect x="112" y="130" width="30" height="4" rx="2" fill="#10B981"/>
                  <rect x="112" y="138" width="55" height="4" rx="2" fill="#059669"/>
                  <rect x="112" y="146" width="42" height="4" rx="2" fill="#F59E0B"/>
                  <!-- Sparkles -->
                  <circle cx="70" cy="50" r="4" fill="#10B981"/>
                  <circle cx="210" cy="65" r="5" fill="#059669"/>
                  <polygon points="65,90 68,96 74,99 68,102 65,108 62,102 56,99 62,96" fill="#F59E0B"/>
                </svg>

                <h4 class="fw-bold text-navy mb-2" id="promoTitle">Build Skills<br>Create Opportunities</h4>
                <p class="text-secondary fw-semibold small mb-0 px-3" id="promoDesc">Your career journey starts here.</p>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <style>
    .role-select-card {
      border: 1.5px solid #E5E7EB;
      background-color: #FFFFFF;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .role-select-card:hover {
      border-color: #10B981;
      background-color: #F0FDF4;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.08);
    }
    .role-select-card.active {
      border: 2px solid #059669 !important;
      background-color: #ECFDF5 !important;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.14) !important;
    }
    .role-select-card.active .role-label {
      color: #065F46 !important;
    }
    .role-select-card.active .role-check-indicator {
      display: block !important;
    }
  </style>

  <!-- Bootstrap 5 JS Bundle & API client -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const infoBox = document.getElementById('infoBox');
    const submitBtn = document.getElementById('submitBtn');
    const submitBtnText = document.getElementById('submitBtnText');
    const rolePromptText = document.getElementById('rolePromptText');
    const registerPromptBox = document.getElementById('registerPromptBox');
    const promoTitle = document.getElementById('promoTitle');
    const promoDesc = document.getElementById('promoDesc');

    let currentSelectedRole = null;

    // Check URL query parameters for session expiration messages or default role
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('session') === 'expired') {
      infoBox.textContent = 'Your session has expired. Please log in again.';
      infoBox.classList.remove('d-none');
    }

    // Role Selection Handler
    function selectLoginRole(role) {
      currentSelectedRole = role;
      alertBox.classList.add('d-none');

      const btnStudent = document.getElementById('roleBtnStudent');
      const btnAdmin = document.getElementById('roleBtnAdmin');

      if (role === 'student') {
        btnStudent.classList.add('active');
        btnAdmin.classList.remove('active');
        submitBtnText.textContent = 'Login as Student';
        rolePromptText.innerHTML = '<i class="bi bi-mortarboard text-primary me-1"></i>Logging in to <strong>Student Portal</strong> (Roadmaps, Skills & Career Tracker).';
        registerPromptBox.classList.remove('d-none');
        promoTitle.innerHTML = 'Build Skills<br>Create Opportunities';
        promoDesc.textContent = 'Your career journey starts here.';
      } else if (role === 'admin') {
        btnAdmin.classList.add('active');
        btnStudent.classList.remove('active');
        submitBtnText.textContent = 'Login as Administrator';
        rolePromptText.innerHTML = '<i class="bi bi-shield-lock text-primary me-1"></i>Logging in to <strong>Admin Portal</strong> (Platform Management & Analytics).';
        registerPromptBox.classList.add('d-none'); // Registration is only for students
        promoTitle.innerHTML = 'Administrative<br>Control Center';
        promoDesc.textContent = 'Platform analytics, student oversight & curriculum tools.';
      }

      // Reveal email/password fields and login button after selection
      form.classList.remove('d-none');
      document.getElementById('email').focus();
    }

    // Auto-select student role by default if specified in query or default view
    if (urlParams.get('role') === 'admin') {
      selectLoginRole('admin');
    } else if (urlParams.get('role') === 'student') {
      selectLoginRole('student');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');
      infoBox.classList.add('d-none');

      if (!currentSelectedRole) {
        alertBox.textContent = 'Please select either Student Login or Admin Login before logging in.';
        alertBox.classList.remove('d-none');
        return;
      }

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        alertBox.textContent = 'Please enter both your email and password.';
        alertBox.classList.remove('d-none');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verifying credentials...';

      try {
        const response = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password, role: currentSelectedRole })
        });

        // Strict role validation on client as safety check
        if (!response.user || response.user.role !== currentSelectedRole) {
          clearSession();
          throw new Error(
            currentSelectedRole === 'admin'
              ? 'Access denied: This account is registered as a student. Please select Student Login to continue.'
              : 'Access denied: This account is registered as an administrator. Please select Admin Login to continue.'
          );
        }

        // Save session
        setSession(response.user, response.token);
        showToast('Login successful! Welcome back.', 'success');

        // Redirect based on verified role
        const redirectUrl = response.user.role === 'admin' ? 'admin.html' : 'dashboard.html';

        setTimeout(() => {
          window.location.href = redirectUrl;
        }, 600);
      } catch (err) {
        alertBox.textContent = err.message || 'Invalid email or password.';
        alertBox.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>${currentSelectedRole === 'admin' ? 'Login as Administrator' : 'Login as Student'}</span> <i class="bi bi-box-arrow-in-right ms-1"></i>`;
      }
    });
  </script>
</body>
</html>
