<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account – SkillForge</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Design System -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

  <!-- Top Simple Nav -->
  <nav class="navbar navbar-expand-lg public-navbar">
    <div class="container-fluid max-w-1200 px-lg-4">
      <a class="brand-logo" href="index.html">
        <div class="brand-icon">
          <i class="bi bi-hammer"></i>
        </div>
        <span>SkillForge</span>
      </a>
      <div class="ms-auto">
        <span class="text-muted small me-2 d-none d-sm-inline">Already have an account?</span>
        <a href="login.html" class="btn btn-forge-outline-dark btn-sm">Login</a>
      </div>
    </div>
  </nav>

  <!-- Register Container (Matches Panel 2 in screenshot) -->
  <main class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-xl-9 col-lg-10">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="row g-0">
            
            <!-- Left Form Column -->
            <div class="col-md-7 p-4 p-lg-5 bg-white">
              <div class="mb-4">
                <h3 class="fw-bold text-navy mb-1">Create Your Account</h3>
                <p class="text-muted small">Join SkillForge and start building your future</p>
              </div>

              <!-- Alert Box for Error Messages -->
              <div id="alertBox" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

              <form id="registerForm" novalidate>
                <div class="mb-3">
                  <label for="fullName" class="form-label small fw-semibold text-secondary">Full Name</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control bg-light border-start-0" id="fullName" placeholder="Enter your full name" required>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label small fw-semibold text-secondary">Email Address</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control bg-light border-start-0" id="email" placeholder="Enter your email" required>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control bg-light border-start-0" id="password" placeholder="Create a password (min 6 chars)" required minlength="6">
                  </div>
                </div>

                <div class="mb-4">
                  <label for="confirmPassword" class="form-label small fw-semibold text-secondary">Confirm Password</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
                    <input type="password" class="form-control bg-light border-start-0" id="confirmPassword" placeholder="Confirm your password" required minlength="6">
                  </div>
                </div>

                <button type="submit" class="btn btn-forge-primary w-100 py-2 mb-3" id="submitBtn">
                  <span>Register</span>
                  <i class="bi bi-arrow-right ms-1"></i>
                </button>

                <div class="text-center">
                  <span class="text-muted small">Already have an account? </span>
                  <a href="login.html" class="text-primary fw-semibold small text-decoration-none">Login</a>
                </div>
              </form>
            </div>

            <!-- Right Promotional / Illustration Column -->
            <div class="col-md-5 p-4 p-lg-5 text-center d-flex flex-column justify-content-center" style="background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%);">
              <div class="my-auto py-3">
                <!-- Academic / Career Vector SVG -->
                <svg viewBox="0 0 280 220" class="img-fluid mb-4" style="max-height: 190px;" xmlns="http://www.w3.org/2000/svg">
                  <!-- Books stack -->
                  <rect x="50" y="160" width="180" height="24" rx="4" fill="#6366F1"/>
                  <rect x="60" y="132" width="160" height="24" rx="4" fill="#38BDF8"/>
                  <rect x="75" y="104" width="130" height="24" rx="4" fill="#10B981"/>
                  <!-- Graduation Cap -->
                  <polygon points="140,40 70,68 140,96 210,68" fill="#1E293B"/>
                  <rect x="110" y="75" width="60" height="20" rx="4" fill="#0F172A"/>
                  <path d="M70 68 L70 110" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
                  <circle cx="70" cy="112" r="5" fill="#F59E0B"/>
                  <!-- Leaves / Sprout -->
                  <path d="M140 100 Q130 70 100 70 Q120 90 140 100" fill="#22C55E"/>
                  <path d="M140 100 Q150 65 180 70 Q160 90 140 100" fill="#16A34A"/>
                </svg>

                <h4 class="fw-bold text-navy mb-2">Learn<br>Grow<br>Succeed</h4>
                <p class="text-muted small mb-0 px-3">Your Skills. Your Career. Our Support.</p>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap 5 JS Bundle & API client -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Registration form handler
    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');

      const name = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!name || !email || !password || !confirmPassword) {
        alertBox.textContent = 'Please fill out all required fields.';
        alertBox.classList.remove('d-none');
        return;
      }

      if (password !== confirmPassword) {
        alertBox.textContent = 'Passwords do not match. Please verify.';
        alertBox.classList.remove('d-none');
        return;
      }

      if (password.length < 6) {
        alertBox.textContent = 'Password must be at least 6 characters.';
        alertBox.classList.remove('d-none');
        return;
      }

      // Submit to backend
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

      try {
        const response = await apiFetch('/auth/register', {
          method: 'POST',
          body: JSON.stringify({ name, email, password, confirmPassword })
        });

        // Store user and token in session
        setSession(response.user, response.token);
        showToast('Registration successful! Redirecting to dashboard...', 'success');
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);
      } catch (err) {
        alertBox.textContent = err.message || 'Registration failed. Please try again.';
        alertBox.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Register</span> <i class="bi bi-arrow-right ms-1"></i>';
      }
    });
  </script>
</body>
</html>
